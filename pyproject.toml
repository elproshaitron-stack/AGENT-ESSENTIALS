[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "agent-essentials"
version = "0.1.0"
description = "The missing toolkit for AI agents: design, validate, optimize and scale agents before production."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Agent Essentials Contributors" }]
keywords = [
    "ai",
    "agents",
    "llm",
    "architecture",
    "rag",
    "memory",
    "planning",
    "hallucination",
    "tokens",
    "cost-optimization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# The core toolkit has ZERO required runtime dependencies (stdlib only).
# Everything heavyweight is an optional extra.
dependencies = []

[project.optional-dependencies]
tokenizers = ["tiktoken>=0.7"]
llm = ["openai>=1.30", "anthropic>=0.34"]
all = ["tiktoken>=0.7", "openai>=1.30", "anthropic>=0.34"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]

[project.urls]
Homepage = "https://github.com/agent-essentials/agent-essentials"
Documentation = "https://github.com/agent-essentials/agent-essentials/tree/main/docs"
Repository = "https://github.com/agent-essentials/agent-essentials"
Issues = "https://github.com/agent-essentials/agent-essentials/issues"
Changelog = "https://github.com/agent-essentials/agent-essentials/blob/main/CHANGELOG.md"

[project.scripts]
agent-essentials = "agent_essentials.cli:main"
ae = "agent_essentials.cli:main"

# Built-in modules are registered through the same plugin entry-point group
# that third-party plugins use. This keeps the core and the ecosystem symmetric.
[project.entry-points."agent_essentials.plugins"]
architecture = "agent_essentials.architecture:plugin"
memory = "agent_essentials.memory:plugin"
planning = "agent_essentials.planning:plugin"
validation = "agent_essentials.validation:plugin"
entailment = "agent_essentials.validation:entailment_plugin"
optimization = "agent_essentials.optimization:plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_essentials"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md", "ROADMAP.md", "SECURITY.md", "CODE_OF_CONDUCT.md", "mkdocs.yml"]

# ----------------------------------------------------------------------------
# Tooling
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["agent_essentials"]
omit = ["*/__about__.py", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
# UP042: we intentionally use `str, Enum` (not StrEnum) so result enums remain
# importable on 3.10/3.11 toolchains used in some CI matrices; valid on 3.12 too.
ignore = ["B008", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["agent_essentials"]

[tool.mypy]
python_version = "3.12"
packages = ["agent_essentials"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
